name: "Test Build"

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-linux-arm:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive

    - name: Install and verify pinned JDK from jvm.json
      run: |
        bash jvm/installJdk.sh
        JAVA_HOME=$HOME/bin/CaDoodle-ApplicationInstall/$(bash jvm/getJdkArchiveName.sh)
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

    - name: List directory contents
      run: pwd; ls -la

    - name: start xvfb
      run:
        Xvfb :0 &

    - name: initialize the X11 DISPLAY variable
      run:
        export DISPLAY=:0

    - name: After checkout, list directory contents
      run: pwd; ls -la

    - name: Install libraries
      run: |
          sudo apt update
          sudo apt install libgtk2.0-0

    - name: Test with Gradle
      run: xvfb-run -s '-screen 0 1024x768x24' ./gradlew test
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive

    - name: Install and verify pinned JDK from jvm.json
      shell: bash
      run: |
        bash jvm/installJdk.sh
        JAVA_HOME=$HOME/bin/CaDoodle-ApplicationInstall/$(bash jvm/getJdkArchiveName.sh)
        # gradlew.bat needs a native Windows path, not the MSYS form bash produces
        echo "JAVA_HOME=$(cygpath -w "$JAVA_HOME")" >> $GITHUB_ENV
        echo "$JAVA_HOME/bin" >> $GITHUB_PATH

    - name: Test with Gradle
      run: ./gradlew test
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive
    - name: Install and verify pinned JDK from jvm.json
      run: |
        bash jvm/installJdk.sh
        JAVA_HOME=$HOME/bin/CaDoodle-ApplicationInstall/$(bash jvm/getJdkArchiveName.sh)
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
    - name: Test with Gradle
      run: ./gradlew test
  build-linux-x86:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
      options: --user root
    env:
      CC: gcc
      CXX: g++
    steps:
    - run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
            unzip \
            curl \
            wget \
            jq \
            ca-certificates \
            lsb-release \
            gnupg \
            git \
            file \
            xz-utils \
            openjdk-11-jdk \
            gcc \
            g++ \
            make \
            maven \
            libgtk2.0-0 \
            xvfb
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive        
        
    - name: Install and verify pinned JDK from jvm.json
      run: |
        bash jvm/installJdk.sh
        JAVA_HOME=$HOME/bin/CaDoodle-ApplicationInstall/$(bash jvm/getJdkArchiveName.sh)
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV

    - name: List directory contents
      run: pwd; ls -la      
      
    - name: start xvfb
      run:
        Xvfb :0 &

    - name: initialize the X11 DISPLAY variable
      run:
        export DISPLAY=:0

    - name: After checkout, list directory contnts
      run: pwd; ls -la        

    - name: Test with Gradle 
      run: xvfb-run -s '-screen 0 1024x768x24' ./gradlew test     
  
      

  # Catch dependency changes that would make the lockfile inconsistent.
  # Regenerate after a dependency change and commit the result:
  #   ./gradlew --write-locks lockClasspaths
  lockfile-drift:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '25'

    - name: Regenerate lockfile
      run: ./gradlew --no-daemon --write-locks lockClasspaths

    - name: Fail if lockfile changed
      run: |
        if ! git diff --exit-code -- gradle.lockfile; then
          echo "::error::gradle.lockfile is out of date. Regenerate it and commit the result:"
          echo "  ./gradlew --write-locks lockClasspaths"
          exit 1
        fi
